name: Weekly Expense Summary Cron

on:
  schedule:
    # Runs at 04:00 UTC (9:30 AM IST) on Sunday
    - cron: '0 4 * * 0'
  workflow_dispatch: # Allows manual trigger from GitHub UI

permissions:
  contents: read

jobs:
  trigger-cron:
    uses: ./.github/workflows/shared-cron-action.yml
    with:
      endpoint: /api/cron/expenses?period=weekly
      job_name: Weekly Expense Summary
    secrets:
      APP_URL: ${{ secrets.APP_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
