name: API Health Check

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping-health:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel Health Check
        run: |
          curl -f -X GET https://continuum-home.vercel.app/api/cron/health \
          -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
