name: Daily Recommendations Cron

on:
  schedule:
    # Runs at 02:00 UTC (7:30 AM IST) every day
    - cron: '0 2 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

permissions:
  contents: read

jobs:
  trigger-cron:
    uses: ./.github/workflows/shared-cron-action.yml
    with:
      endpoint: /api/cron/recommendations
      job_name: Daily Recommendations
    secrets:
      APP_URL: ${{ secrets.APP_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
